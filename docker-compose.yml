version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: cyhotel-db
    environment:
      POSTGRES_USER: cyhotel
      POSTGRES_PASSWORD: ${CYHOTEL_DB_PASSWORD:?Defina CYHOTEL_DB_PASSWORD en el .env}
      POSTGRES_DB: cyhotel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyhotel -d cyhotel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - backend

  kiosco:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODE: kiosco
    container_name: cyhotel-kiosco
    environment:
      APP_MODE: kiosco
      HOTEL_ID: "1"
      DATABASE_URL: postgresql://cyhotel:${CYHOTEL_DB_PASSWORD:?Defina CYHOTEL_DB_PASSWORD en el .env}@db:5432/cyhotel
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - backend
    volumes:
      - ./web:/app/web

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODE: admin
    container_name: cyhotel-admin
    environment:
      APP_MODE: admin
      HOTEL_ID: "1"
      DATABASE_URL: postgresql://cyhotel:${CYHOTEL_DB_PASSWORD:?Defina CYHOTEL_DB_PASSWORD en el .env}@db:5432/cyhotel
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - backend

  master:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODE: master
    container_name: cyhotel-master
    environment:
      APP_MODE: master
      DATABASE_URL: postgresql://cyhotel:${CYHOTEL_DB_PASSWORD:?Defina CYHOTEL_DB_PASSWORD en el .env}@db:5432/cyhotel
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - backend

volumes:
  pgdata:

networks:
  backend:
    driver: bridge
