plugins { id 'com.android.application' }

def ksFile = new File('/home/CyHotel/keys/keystore.properties')
def ksProps = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }

android {
    namespace 'com.hoteldelvalle.kiosco'
    compileSdk 34

    defaultConfig {
        applicationId "com.hoteldelvalle.kiosco"
        minSdk 26
        targetSdk 34
        versionCode 20000
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            storeFile file(ksProps['KEYSTORE'] ?: '')
            storePassword ksProps['KS_PASS']
            keyAlias ksProps['KEY_ALIAS']
            keyPassword ksProps['KEY_PASS']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
